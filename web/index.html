<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CariRadar - Akıllı Saha & Bakiye Takip</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="description" content="50m yaklaşma bildirimli ve canlı bakiye takipli mobil cari haritası" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CariRadar" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-blue-600 selection:text-white select-none overflow-x-hidden">
    <!-- React Mount Root ile birlikte İlk Yüklenme Splash Ekranı (Mobilde beyaz/boş ekran kalmasını önler) -->
    <div id="root">
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #4f46e5); opacity: 0.85; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
              <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/>
              <circle cx="12" cy="12" r="2"/>
              <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/>
              <path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff;">CariRadar</div>
        <div style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Uygulama hazırlanıyor...</div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Modern PWA Service Worker Kaydı & Otomatik Yenileme / İyileştirme -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              // Her açılışta sunucudaki yeni sürümü kontrol et
              reg.update();

              // Yeni sürüm indiğinde beklemeden aktifleştir
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Yeni sürüm aktifleşti, güncelleniyor...');
                      window.location.reload();
                    }
                  });
                }
              });
            })
            .catch((err) => console.warn('[PWA] SW kayıt hatası:', err));
        });
      }

      // Eski önbellek veya chunk hatası tespit edilirse önbelleği temizleyip sayfayı yenile
      window.addEventListener('error', (e) => {
        const msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.includes('dynamically imported module') || msg.includes('loading chunk') || msg.includes('unexpected token')) {
          if ('caches' in window) {
            caches.keys().then((names) => {
              Promise.all(names.map((n) => caches.delete(n))).then(() => {
                window.location.reload();
              });
            });
          }
        }
      });
    </script>
  </body>
</html>
